          anyOf:
          - type: string
          - type: 'null'
          title: Email
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        role:
          type: string
          title: Role
        tier:
          type: string
          title: Tier
        is_admin:
          type: boolean
          title: Is Admin
        is_active:
          type: boolean
          title: Is Active
        is_deleted:
          type: boolean
          title: Is Deleted
        auth_suspended:
          type: boolean
          title: Auth Suspended
        active_keys:
          type: integer
          title: Active Keys
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - email
      - display_name
      - role
      - tier
      - is_admin
      - is_active
      - is_deleted
      - auth_suspended
      - active_keys
      - created_at
      title: AdminUser
    AdminUserList:
      properties:
        users:
          items:
            $ref: '#/components/schemas/AdminUser'
          type: array
          title: Users
        total:
          type: integer
          title: Total
      type: object
      required:
      - users
      - total
      title: AdminUserList
    ApiKeyResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        prefix:
          type: string
          title: Prefix
        created_at:
          type: string
          format: date-time
          title: Created At
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
      type: object
      required:
      - id
      - name
      - prefix
      - created_at
      - last_used_at
      title: ApiKeyResponse
    CreateApiKeyRequest:
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
          pattern: ^[^\x00-\x1f\x7f]*$
          title: Name
      type: object
      required:
      - name
      title: CreateApiKeyRequest
    CreateUserRequest:
      properties:
        email:
          type: string
          maxLength: 254
          pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
