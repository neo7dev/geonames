        password:
          type: string
          maxLength: 72
          title: Password
        display_name:
          anyOf:
          - type: string
            maxLength: 100
            pattern: ^[^\x00-\x1f\x7f]*$
          - type: 'null'
          title: Display Name
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
      type: object
      required:
      - email
      - password
      title: CreateUserRequest
    CreatedApiKeyResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        prefix:
          type: string
          title: Prefix
        created_at:
          type: string
          format: date-time
          title: Created At
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
        key:
          type: string
          title: Key
      type: object
      required:
      - id
      - name
      - prefix
      - created_at
      - last_used_at
      - key
      title: CreatedApiKeyResponse
