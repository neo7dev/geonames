include:
  # Supabase services (db, auth, meta, studio, kong); the override publishes db on 5432.
  - path:
      - ../supabase/docker-compose.yml
      - supabase.override.yml
    env_file: .env

services:

  app:
    user: "1000:1000"
    hostname: geonames-server-dev
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    networks:
      - geonames
    environment:
      - PYTHONPATH=/workspace/src
      - ENABLED_DATASETS=${ENABLED_DATASETS}
      # Token for `gh` (make gh-auth), a fine-grained PAT for this repository only.
      # ~/.zsh/host/macbook.secrets.zsh exports GEONAMES_GH_TOKEN from the Keychain
      # (gh-token-geonames) only in the shell VS Code spawns to resolve its
      # environment, so host terminals keep their own gh login. Renamed to
      # GH_TOKEN only in here; nothing is written to disk. A new value needs
      # VS Code fully quit and relaunched: Reload Window and Rebuild Container
      # reuse the cached environment.
      - GH_TOKEN=${GEONAMES_GH_TOKEN:-}
      # Trust /workspace in git. Docker Desktop's VirtioFS now and then reports the
      # bind mount's root as owned by root (docker/for-mac#6298), and git then
      # refuses with "detected dubious ownership". Environment, not a lifecycle
      # command, so it is set before VS Code's Git extension first looks.
      # The host's timezone, so log and file timestamps match its clock. HOST_TZ is
      # exported for VS Code by ~/.zsh/host/*.zsh (shared with the other dev
      # containers). TZ is read at process start: a change needs a rebuild.
      - TZ=${HOST_TZ:-Etc/UTC}
      - GIT_CONFIG_COUNT=1
      - GIT_CONFIG_KEY_0=safe.directory
      - GIT_CONFIG_VALUE_0=/workspace
    volumes:
      - ..:/workspace:cached
      # One GitHub identity: the neo7dev key, not the host's whole ~/.ssh (whose
      # agent offers every key, and GitHub answers as the first it knows).
      # ssh-config, symlinked to ~/.ssh/config by postCreateCommand, names only
      # id_container. The key stays passphrase-protected: VS Code forwards the
      # host ssh-agent, which signs. Long syntax because the devcontainers CLI
      # drops `readonly` from a mount string. ~/.ssh is a volume so known_hosts
      # survives a rebuild.
      - ssh_home:/home/devuser/.ssh
      - type: bind
        source: ${HOME}/.ssh/${GEONAMES_SSH_KEY:-neo7_github}
        target: /home/devuser/.ssh/id_container
        read_only: true
      - type: bind
        source: ${HOME}/.ssh/${GEONAMES_SSH_KEY:-neo7_github}.pub
        target: /home/devuser/.ssh/id_container.pub
        read_only: true
    ports:
      - "9500:9500"
      # Vite dev server for the web UI (make ui-dev)
      - "5173:5173"
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
      # GoTrue migrates auth.users before the app adds its signup trigger
      auth:
        condition: service_healthy
      redis:
        condition: service_started

# Catches all outgoing auth emails (signup confirmation, password reset). UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    hostname: mailpit
    restart: unless-stopped
    networks:
      - geonames
    ports:
      - "8025:8025"
# ---------------------------------------------------------------------------

# In-memory data store for rate limiting, quotas and caching
  redis:
    image: redis:7
    hostname: redis
    restart: unless-stopped
    networks:
      - geonames
    ports:
      - "6379:6379"

# Admin interface for PostgreSQL (pgAdmin) and Metabase for data visualization
  pgadmin:
    image: dpage/pgadmin4
    hostname: pgadmin
    restart: unless-stopped
    networks:
      - geonames
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

  # metabase:
  #   image: metabase/metabase
  #   hostname: metabase
  #   restart: unless-stopped
  #   networks:
  #     - geonames
  #   environment:
  #     MB_DB_TYPE: ${DATABASE_TYPE}
  #     MB_DB_HOST: ${DATABASE_HOST}
  #     MB_DB_PORT: ${DATABASE_PORT}
  #     MB_DB_NAME: ${DATABASE_NAME}
  #     MB_DB_USER: ${DATABASE_USER}
  #     MB_DB_PASS: ${DATABASE_PASSWORD}
  #   ports:
  #     - "3000:3000"

# Gostatic server to host static files for development (e.g. GeoNames dumps)
  gostatic:
    image: pierrezemb/gostatic
    hostname: gostatic
    restart: unless-stopped
    networks:
      - geonames
    volumes:
      - ../gostatic:/srv/http:ro
    ports:
      - "3002:8043"

# NGINX server to simulate slow downloads for testing the downloader's retry and timeout logic
# Change download speed with `make download-speed` (limit_rate in nginx.conf). nginx reloads
# within 2 seconds of nginx.conf changing.
  slow-download-server:
    image: nginx:latest
    hostname: slow-download-server
    restart: unless-stopped
    networks:
      - geonames
    volumes:
      - ../gostatic:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "3003:80"
    command:
      - /bin/sh
      - -c
      - |
        conf=/etc/nginx/conf.d/default.conf
        (
          last=$$(md5sum $$conf)
          while sleep 2; do
            now=$$(md5sum $$conf)
            if [ "$$now" != "$$last" ]; then
              last=$$now
              nginx -t -q && nginx -s reload
            fi
          done
        ) &
        exec nginx -g 'daemon off;'

networks:
  geonames:

volumes:
  # ~/.ssh for known_hosts; the key is bound read-only on top of it.
  ssh_home:
