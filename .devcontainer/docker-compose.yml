services:

  app:
    user: "1000:1000"
    hostname: geonames-server-dev
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    networks:
      - geonames
    environment:
      - PYTHONPATH=/workspace/src
      - ENABLED_DATASETS=${ENABLED_DATASETS}
    volumes:
      - ..:/workspace:cached
    ports:
      - "9500:9500"
    command: sleep infinity
    depends_on:
      - postgres
      # - redis

# PostgreSQL database for storing geonames data and other application data, with persistent storage using Docker volumes
  postgres:
    image: postgres:16
    hostname: postgres
    restart: unless-stopped
    networks:
      - geonames
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

# In-memory data store for caching and fast access to frequently used data
  # redis:
  #   image: redis:7
  #   hostname: redis
  #   restart: unless-stopped
  #   networks:
  #     - geonames
  #   ports:
  #     - "6379:6379"

# Admin interface for PostgreSQL (pgAdmin) and Metabase for data visualization
  pgadmin:
    image: dpage/pgadmin4
    hostname: pgadmin
    restart: unless-stopped
    networks:
      - geonames
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

  # metabase:
  #   image: metabase/metabase
  #   hostname: metabase
  #   restart: unless-stopped
  #   networks:
  #     - geonames
  #   environment:
  #     MB_DB_TYPE: ${DATABASE_TYPE}
  #     MB_DB_HOST: ${DATABASE_HOST}
  #     MB_DB_PORT: ${DATABASE_PORT}
  #     MB_DB_NAME: ${DATABASE_NAME}
  #     MB_DB_USER: ${DATABASE_USER}
  #     MB_DB_PASS: ${DATABASE_PASSWORD}
  #   ports:
  #     - "3000:3000"

# Gostatic server to host static files for development (e.g. GeoNames dumps)
  gostatic:
    image: pierrezemb/gostatic
    hostname: gostatic
    restart: unless-stopped
    networks:
      - geonames
    volumes:
      - ../gostatic:/srv/http:ro
    ports:
      - "3002:8043"

# NGINX server to simulate slow downloads for testing the downloader's retry and timeout logic
# Change download speed in nginx.conf (e.g. limit_rate 10m;) to simulate different network conditions
  slow-download-server:
    image: nginx:latest
    hostname: slow-download-server
    restart: unless-stopped
    networks:
      - geonames
    volumes:
      - ../gostatic:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "3003:80"

volumes:
  postgres-data:

networks:
  geonames: