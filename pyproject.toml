[project]
name = "geonames-server"
version = "0.2.0"
description = "A local geonames server from the data from geonames.org"
readme = "README.md"
requires-python = ">=3.12"
# What the server imports at runtime, and nothing else: this is what the Docker
# image installs (requirements.txt). Tools go in the dev group, test libraries
# in the test group.
dependencies = [
    "alembic==1.18.4",
    "apscheduler==3.11.0",
    "fastapi==0.129.0",
    # uvicorn uses httptools and uvloop when installed: faster HTTP parsing and event loop
    "httptools==0.7.1",
    "httpx==0.28.1",
    # psycopg 3 for SQLAlchemy (sync and async), psycopg2 for the raw COPY loads
    "psycopg[binary]==3.3.3",
    "psycopg2-binary==2.9.11",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "pyjwt==2.15.1",
    "python-dotenv==1.2.1",
    "redis==7.1.1",
    "requests==2.32.5",
    "rich==14.3.2",
    "sqlalchemy[asyncio]==2.0.46",
    "uvicorn==0.40.0",
    "uvloop==0.22.1",
]

[tool.pytest.ini_options]
# The scratch scripts under src/ are named test_* too
testpaths = ["tests"]

[tool.poe.tasks]
test = "pytest tests/"

[dependency-groups]
# Development tools; pyyaml for scripts/openapi.py
dev = [
    "poethepoet>=0.42.1",
    "pyapp>=4.16.1",
    "pyyaml==6.0.3",
    "ruff>=0.16.10",
]
test = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pyyaml==6.0.3",
]

[tool.uv]
# uv sync installs both groups; the image installs neither (requirements.txt).
default-groups = ["dev", "test"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["data", "logs", "gostatic"]

[tool.ruff.lint]
# Ruff's classic defaults (pyflakes and the pycodestyle errors) plus import sorting.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Rewrites ENABLED_DATASETS before the app modules read settings on import
"tests/ingestion/test_daily_update.py" = ["E402"]
