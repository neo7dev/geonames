# GENERATED by `make deploy-compose` from deploy/docker-compose.template.yml and
# supabase/. Do not edit: changes here are overwritten.

# geonames-server deployment: the app, Redis and a trimmed self-hosted Supabase (db, auth,
# meta, studio, kong). This one file is all you need, next to a .env:
#
#   1. Secrets (run once; ANON_KEY and SERVICE_ROLE_KEY are signed with that run's JWT_SECRET):
#        docker run --rm --entrypoint python ghcr.io/neo7dev/geonames-server \
#          -m geonames_server.scripts.supabase_keys > .env
#   2. Add to .env: ADMIN_EMAIL and ADMIN_PASSWORD (the first admin account), and the public
#      URLs if users reach the server anywhere but localhost: SUPABASE_PUBLIC_URL,
#      API_EXTERNAL_URL (= SUPABASE_PUBLIC_URL + /auth/v1) and SITE_URL (= the UI's URL + /ui/).
#   3. docker compose up -d
#
# Every other setting has a default here and can be overridden in .env; .env.example in the
# repository lists them all (SMTP, ENABLED_DATASETS, LOG_LEVEL, signups, OAuth, ...).
#
#   API + web UI:   http://localhost:${APP_PORT:-9500} (health: /health, UI: /ui)
#   Studio + Auth:  http://localhost:${KONG_HTTP_PORT:-8000} (Studio: basic auth DASHBOARD_USERNAME / DASHBOARD_PASSWORD)
#
# TLS is up to you: put your own reverse proxy in front of both ports.

services:
  app:
    # make build-image tags local builds with this name, so they run without a pull.
    image: ${GEONAMES_IMAGE:-ghcr.io/neo7dev/geonames-server:latest}
    hostname: geonames-server
    restart: unless-stopped
    # No tty: Docker's would be 80 columns and not the viewer's terminal. Logs are
    # drawn at LOG_WIDTH instead, in colour through FORCE_COLOR below.
    depends_on:
      db:
        condition: service_healthy
      # GoTrue migrates auth.users before the app adds its signup trigger
      auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - geonames
    ports:
      - "${APP_PORT:-9500}:9500"
    # Any app setting can go in .env (see .env.example).
    env_file:
      - .env
    # Settings whose app default does not fit this stack. Values in .env win.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      # Timezone of the logs (an IANA name such as Europe/London). Schedules and
      # rate-limit windows are in UTC whatever this says.
      TZ: ${TZ:-Etc/UTC}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # required for colorized output in logs, DO NOT CHANGE
      FORCE_COLOR: 1
      TERM: xterm-256color
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs

# Rate limiting, quotas and caching. Append-only file so counters survive restarts.
  redis:
    image: redis:7
    hostname: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "${REDIS_LOG_LEVEL:-warning}"]
    networks:
      - geonames
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

# Postgres for geonames data, app data and Supabase auth. The app connects as `postgres`
# to database `postgres` (Supabase expects that name; `postgres` is not a superuser here).
  db:
    image: supabase/postgres:17.6.1.136
    hostname: db
    restart: unless-stopped
    networks:
      - geonames
    # Not published to the host; .devcontainer/supabase.override.yml publishes 5432 in dev.
    configs:
      # Must be superuser to alter reserved role
      - source: supabase_db_roles
        target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
      # Initialize the database settings with JWT_EXP
      - source: supabase_db_jwt
        target: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      # Persist pgsodium decryption key between restarts
      - supabase-db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT:-5432}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGPASSWORD: ${POSTGRES_PASSWORD:?run make supabase-keys and set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make supabase-keys and set it in .env}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]

# GoTrue: signup/login, email confirmation, OAuth
  auth:
    image: supabase/gotrue:v2.196.0
    hostname: auth
    restart: unless-stopped
    networks:
      - geonames
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    environment:
      # warn: no line per request, signup or login (the app's Activity log has those)
      GOTRUE_LOG_LEVEL: ${AUTH_LOG_LEVEL:-warn}
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000/auth/v1}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:?run make supabase-keys and set it in .env}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}

      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:9500/ui/}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?run make supabase-keys and set it in .env}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL:-http://localhost:8000/auth/v1}

      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"

      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      # Blank would stop GoTrue from starting; no SMTP host means no mail is sent anyway
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Geonames Server}
      GOTRUE_MAILER_URLPATHS_INVITE: ${MAILER_URLPATHS_INVITE:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: ${MAILER_URLPATHS_CONFIRMATION:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_RECOVERY: ${MAILER_URLPATHS_RECOVERY:-/auth/v1/verify}
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: ${MAILER_URLPATHS_EMAIL_CHANGE:-/auth/v1/verify}

      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL:-http://localhost:8000/auth/v1}/callback

      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GITHUB_ENABLED:-false}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GITHUB_SECRET:-}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${API_EXTERNAL_URL:-http://localhost:8000/auth/v1}/callback

# Postgres metadata API used by Studio (table editor, SQL editor)
  meta:
    image: supabase/postgres-meta:v0.99.0
    hostname: meta
    restart: unless-stopped
    networks:
      - geonames
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST:-db}
      PG_META_DB_PORT: ${POSTGRES_PORT:-5432}
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:?run make supabase-keys and set it in .env}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?run make supabase-keys and set it in .env}

# Supabase Studio: admin dashboard (users, roles, tables). Reached through kong.
  studio:
    image: supabase/studio:2026.09.07-sha-7996410
    hostname: studio
    restart: unless-stopped
    networks:
      - geonames
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    depends_on:
      meta:
        condition: service_started
    environment:
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: 1

      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make supabase-keys and set it in .env}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?run make supabase-keys and set it in .env}

      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-Geonames}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-geonames-server}

      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      SUPABASE_ANON_KEY: ${ANON_KEY:?run make supabase-keys and set it in .env}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?run make supabase-keys and set it in .env}
      AUTH_JWT_SECRET: ${JWT_SECRET:?run make supabase-keys and set it in .env}

      # Analytics (logflare) is not deployed
      ENABLED_FEATURES_LOGS_ALL: "false"
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
    volumes:
      - supabase-studio-snippets:/app/snippets

# API gateway: routes /auth/v1 to GoTrue, /pg to meta, everything else to Studio
  kong:
    image: kong/kong:3.9.3
    hostname: kong
    restart: unless-stopped
    networks:
      - geonames
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      studio:
        condition: service_healthy
      auth:
        condition: service_healthy
    ports:
      - "${KONG_HTTP_PORT:-8000}:8000"
    configs:
      - source: supabase_kong_config
        target: /home/kong/temp.yml
      - source: supabase_kong_entrypoint
        target: /home/kong/kong-entrypoint.sh
    environment:
      # No line per request (the app logs its own) and no startup notices
      KONG_PROXY_ACCESS_LOG: ${KONG_ACCESS_LOG:-off}
      KONG_ADMIN_ACCESS_LOG: "off"
      KONG_LOG_LEVEL: ${KONG_LOG_LEVEL:-warn}
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY:?run make supabase-keys and set it in .env}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?run make supabase-keys and set it in .env}
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?run make supabase-keys and set it in .env}
    entrypoint: ["/bin/sh", "/home/kong/kong-entrypoint.sh"]

networks:
  geonames:

volumes:
  redis-data:
  app-data:
  app-logs:
  supabase-db-data:
  supabase-db-config:
  supabase-studio-snippets:

# Supabase's config files, inline so this file works on its own.
configs:
  supabase_db_roles:
    content: |
      -- From supabase/supabase docker/volumes/db/roles.sql, trimmed to the services we run.
      -- supabase_functions_admin is dropped: it only exists when webhooks.sql (edge functions) runs,
      -- and the failed ALTER aborts database initialisation.
      -- NOTE: change to your own passwords for production environments
      \set pgpass `echo "$$POSTGRES_PASSWORD"`

      ALTER USER authenticator WITH PASSWORD :'pgpass';
      ALTER USER supabase_auth_admin WITH PASSWORD :'pgpass';
  supabase_db_jwt:
    content: |
      \set jwt_exp `echo "$$JWT_EXP"`

      ALTER DATABASE postgres SET "app.settings.jwt_exp" TO :'jwt_exp';
  supabase_kong_config:
    content: |
      # Trimmed from supabase/supabase docker/volumes/api/kong.yml (master, 2026-10).
      # Only the services this project runs are routed: auth (GoTrue), pg-meta and Studio.
      # PostgREST, GraphQL, Realtime, Storage, Edge Functions and Analytics are not deployed.
      # $$VARS are substituted by kong-entrypoint.sh at container start.
      _format_version: '2.1'
      _transform: true

      ###
      ### Consumers / Users
      ###
      consumers:
        - username: DASHBOARD
        - username: anon
          keyauth_credentials:
            - key: $$SUPABASE_ANON_KEY
            - key: $$SUPABASE_PUBLISHABLE_KEY
        - username: service_role
          keyauth_credentials:
            - key: $$SUPABASE_SERVICE_KEY
            - key: $$SUPABASE_SECRET_KEY

      ###
      ### Access Control List
      ###
      acls:
        - consumer: anon
          group: anon
        - consumer: service_role
          group: admin

      ###
      ### Dashboard credentials
      ###
      basicauth_credentials:
        - consumer: DASHBOARD
          username: '$$DASHBOARD_USERNAME'
          password: '$$DASHBOARD_PASSWORD'

      ###
      ### API Routes
      ###
      services:
        ## Open Auth routes
        - name: auth-v1-open
          _comment: 'Auth: /auth/v1/verify* -> http://auth:9999/verify*'
          url: http://auth:9999/verify
          routes:
            - name: auth-v1-open
              strip_path: true
              paths:
                - /auth/v1/verify
          plugins:
            - name: cors
        - name: auth-v1-open-callback
          _comment: 'Auth: /auth/v1/callback* -> http://auth:9999/callback*'
          url: http://auth:9999/callback
          routes:
            - name: auth-v1-open-callback
              strip_path: true
              paths:
                - /auth/v1/callback
          plugins:
            - name: cors
        - name: auth-v1-open-authorize
          _comment: 'Auth: /auth/v1/authorize* -> http://auth:9999/authorize*'
          url: http://auth:9999/authorize
          routes:
            - name: auth-v1-open-authorize
              strip_path: true
              paths:
                - /auth/v1/authorize
          plugins:
            - name: cors
        - name: auth-v1-open-jwks
          _comment: 'Auth: /auth/v1/.well-known/jwks.json -> http://auth:9999/.well-known/jwks.json'
          url: http://auth:9999/.well-known/jwks.json
          routes:
            - name: auth-v1-open-jwks
              strip_path: true
              paths:
                - /auth/v1/.well-known/jwks.json
          plugins:
            - name: cors

        ## Secure Auth routes
        - name: auth-v1
          _comment: 'Auth: /auth/v1/* -> http://auth:9999/*'
          url: http://auth:9999/
          routes:
            - name: auth-v1-all
              strip_path: true
              paths:
                - /auth/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $$LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## OAuth 2.0 Authorization Server Metadata (RFC 8414)
        - name: well-known-oauth
          _comment: 'Auth: /.well-known/oauth-authorization-server -> http://auth:9999/.well-known/oauth-authorization-server'
          url: http://auth:9999/.well-known/oauth-authorization-server
          routes:
            - name: well-known-oauth
              strip_path: true
              paths:
                - /.well-known/oauth-authorization-server
          plugins:
            - name: cors

        ## Secure Database routes
        - name: meta
          _comment: 'pg-meta: /pg/* -> http://pg-meta:8080/*'
          url: http://meta:8080/
          routes:
            - name: meta-all
              strip_path: true
              paths:
                - /pg/
          plugins:
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin

        ## Block access to Studio's MCP endpoint
        - name: mcp-blocker
          _comment: 'Block direct access to /api/mcp'
          url: http://studio:3000/api/mcp
          routes:
            - name: mcp-blocker-route
              strip_path: true
              paths:
                - /api/mcp
          plugins:
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."
        - name: mcp
          _comment: 'MCP: /mcp -> http://studio:3000/api/mcp (blocked)'
          url: http://studio:3000/api/mcp
          routes:
            - name: mcp
              strip_path: true
              paths:
                - /mcp
          plugins:
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."

        ## Protected Dashboard - catch all remaining routes
        - name: dashboard
          _comment: 'Studio: /* -> http://studio:3000/*'
          url: http://studio:3000/
          routes:
            - name: dashboard-all
              strip_path: true
              paths:
                - /
          plugins:
            - name: cors
            - name: basic-auth
              config:
                hide_credentials: true
  supabase_kong_entrypoint:
    content: |
      #!/bin/sh
      # Custom entrypoint for Kong that builds Lua expressions for request-transformer
      # and performs environment variable substitution in the declarative config.

      # Build Lua expressions for translating opaque API keys to asymmetric JWTs.
      # When opaque keys are not configured (empty env vars), expressions fall through
      # to legacy-only behavior - just passing apikey as-is.
      #
      # Full expression logic (when opaque keys are configured):
      #   1. If Authorization header exists and is NOT an sb_ key -> pass through (user session JWT)
      #   2. If apikey matches secret key -> set service_role asymmetric JWT internal "API key"
      #   3. If apikey matches publishable key -> set anon asymmetric JWT internal "API key"
      #   4. Fallback: pass apikey as-is (legacy HS256 JWT)

      if [ -n "$$SUPABASE_SECRET_KEY" ] && [ -n "$$SUPABASE_PUBLISHABLE_KEY" ]; then
          # Opaque keys configured -> full translation expressions
          export LUA_AUTH_EXPR="\$$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '$$SUPABASE_SECRET_KEY' and 'Bearer $$SERVICE_ROLE_KEY_ASYMMETRIC') or (headers.apikey == '$$SUPABASE_PUBLISHABLE_KEY' and 'Bearer $$ANON_KEY_ASYMMETRIC') or headers.apikey)"

          # Realtime WebSocket: reads from query_params.apikey (supabase-js sends apikey
          # via query string), outputs to x-api-key header which Realtime checks first.
          export LUA_RT_WS_EXPR="\$$((query_params.apikey == '$$SUPABASE_SECRET_KEY' and '$$SERVICE_ROLE_KEY_ASYMMETRIC') or (query_params.apikey == '$$SUPABASE_PUBLISHABLE_KEY' and '$$ANON_KEY_ASYMMETRIC') or query_params.apikey)"

          # Functions: translate opaque sb_ keys to the pre-signed internal asymmetric
          # JWT and emit it as a raw `sb-api-key` header (no Bearer prefix), leaving
          # Authorization untouched. The key is read from the apikey header or an
          # Authorization `Bearer sb_...` fallback (header only, matching platform
          # behavior. On no match the expression yields nil (rendered as an empty
          # header) which the route's post-function then strips.
          export LUA_FUNCTIONS_EXPR="\$$((headers.apikey == '$$SUPABASE_SECRET_KEY' and '$$SERVICE_ROLE_KEY_ASYMMETRIC') or (headers.apikey == '$$SUPABASE_PUBLISHABLE_KEY' and '$$ANON_KEY_ASYMMETRIC') or (headers.authorization == 'Bearer $$SUPABASE_SECRET_KEY' and '$$SERVICE_ROLE_KEY_ASYMMETRIC') or (headers.authorization == 'Bearer $$SUPABASE_PUBLISHABLE_KEY' and '$$ANON_KEY_ASYMMETRIC') or nil)"
      else
          # Legacy API keys, not sb_ API keys -> pass apikey through unchanged
          export LUA_AUTH_EXPR="\$$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or headers.apikey)"
          export LUA_RT_WS_EXPR="\$$(query_params.apikey)"

          # Functions: no opaque keys configured -> never set sb-api-key (the empty
          # value is stripped by the route's post-function).
          export LUA_FUNCTIONS_EXPR="\$$(nil)"
      fi

      # Substitute environment variables in the Kong declarative config.
      # Uses awk instead of eval/echo to preserve YAML quoting (eval strips double
      # quotes, breaking "Header: value" patterns that YAML parses as mappings).
      awk '{
        result = ""
        rest = $$0
        while (match(rest, /\$$[A-Za-z_][A-Za-z_0-9]*/)) {
          varname = substr(rest, RSTART + 1, RLENGTH - 1)
          if (varname in ENVIRON) {
            result = result substr(rest, 1, RSTART - 1) ENVIRON[varname]
          } else {
            result = result substr(rest, 1, RSTART + RLENGTH - 1)
          }
          rest = substr(rest, RSTART + RLENGTH)
        }
        print result rest
      }' /home/kong/temp.yml > "$$KONG_DECLARATIVE_CONFIG"

      # Remove empty key-auth credentials (unconfigured opaque keys)
      sed -i '/^[[:space:]]*- key:[[:space:]]*$$/d' "$$KONG_DECLARATIVE_CONFIG"

      exec /entrypoint.sh kong docker-start
