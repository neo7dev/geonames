# Deployment stack: the geonames-server image, Redis and a trimmed self-hosted Supabase.
# The Supabase services (db, auth, meta, studio, kong) live in supabase/docker-compose.yml,
# shared with the devcontainer; deploy this file together with the supabase/ directory.
# Generate secrets with `make supabase-keys` and put them in .env before the first start,
# along with ADMIN_EMAIL / ADMIN_PASSWORD for the first admin account.
# Compose refuses to start while any secret is empty (`${VAR:?...}` in the Supabase file).
#
#   API + web UI:   http://localhost:${APP_PORT:-9500} (health: /health, UI: /ui)
#   Studio + Auth:  http://localhost:${KONG_HTTP_PORT:-8000} (Studio: basic auth DASHBOARD_USERNAME / DASHBOARD_PASSWORD)
#
# The app runs the published image; `make build-image` tags a local build with the same
# name, so `docker compose up` runs the current code without pulling.
# TLS is up to you: put your own reverse proxy in front of both ports.

include:
  - path: supabase/docker-compose.yml
    env_file: .env

services:
  app:
    image: ${GEONAMES_IMAGE:-ghcr.io/neo7dev/geonames-server:latest}
    hostname: geonames-server
    restart: unless-stopped
    tty: true
    stdin_open: true
    depends_on:
      db:
        condition: service_healthy
      # GoTrue migrates auth.users before the app adds its signup trigger
      auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - geonames
    ports:
      - "${APP_PORT:-9500}:9500"
    env_file:
      - .env
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # required for colorized output in logs, DO NOT CHANGE
      FORCE_COLOR: 1
      TERM : xterm-256color
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs

# Rate limiting, quotas and caching. Append-only file so counters survive restarts.
  redis:
    image: redis:7
    hostname: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - geonames
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  geonames:

volumes:
  redis-data:
  app-data:
  app-logs:
